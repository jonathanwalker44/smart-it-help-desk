<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">ABC Company IT Help Desk</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Edit Ticket #{{ ticket[0] }}</h1>
                    <p class="text-muted mb-0">Review and update this support request.</p>
                </div>

                <a href="/dashboard" class="btn btn-outline-secondary">
                    Back to Dashboard
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">

                    <h5 class="card-title mb-3">Requester Information</h5>

                    <p><strong>Name:</strong> {{ ticket[1] }}</p>
                    <p><strong>Email:</strong> {{ ticket[2] }}</p>
                    <p class="mb-0"><strong>Issue:</strong> {{ ticket[3] }}</p>

                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input
                                type="text"
                                name="category"
                                class="form-control"
                                value="{{ ticket[4] or '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-select">

                                <option value="Low"
                                    {% if ticket[5] == 'Low' %}selected{% endif %}>
                                    Low
                                </option>

                                <option value="Medium"
                                    {% if ticket[5] == 'Medium' %}selected{% endif %}>
                                    Medium
                                </option>

                                <option value="High"
                                    {% if ticket[5] == 'High' %}selected{% endif %}>
                                    High
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">

                                <option value="Open"
                                    {% if ticket[6] == 'Open' %}selected{% endif %}>
                                    Open
                                </option>

                                <option value="In Progress"
                                    {% if ticket[6] == 'In Progress' %}selected{% endif %}>
                                    In Progress
                                </option>

                                <option value="Resolved"
                                    {% if ticket[6] == 'Resolved' %}selected{% endif %}>
                                    Resolved
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Assigned To</label>
                            <input
                                type="text"
                                name="assigned_to"
                                class="form-control"
                                value="{{ ticket[7] or '' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resolution Notes</label>
                            <textarea
                                name="resolution_notes"
                                class="form-control"
                                rows="5">{{ ticket[8] or '' }}</textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
