<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Company IT Help Desk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">ABC Company IT Help Desk</span>
        <a href="/login" class="btn btn-outline-light btn-sm">Technician Login</a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="text-center mb-4">
                <h1 class="h2">Submit an IT Support Request</h1>
                <p class="text-muted">
                    Describe the technical issue you are experiencing and the IT team will review your request.
                </p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <form method="POST" action="/submit-ticket">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                name="requester_name"
                                class="form-control"
                                placeholder="Enter your name"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                name="requester_email"
                                class="form-control"
                                placeholder="name@example.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Issue Description</label>
                            <textarea
                                name="issue_description"
                                class="form-control"
                                rows="6"
                                placeholder="Please describe the issue in as much detail as possible."
                                required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Submit Ticket
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <p class="text-center text-muted small mt-3">
                ABC Company Internal IT Support
            </p>

        </div>

    </div>

</div>

</body>
</html>
